<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Cape Adieu — Drinks Stocktake</title>
<link rel="manifest" href="data:application/json;base64,eyJuYW1lIjoiQ2FwZSBBZGlldSBEcmlua3MiLCJzaG9ydF9uYW1lIjoiU3RvY2t0YWtlIiwiZGlzcGxheSI6InN0YW5kYWxvbmUiLCJiYWNrZ3JvdW5kX2NvbG9yIjoiIzFhMWEyZSIsInRoZW1lX2NvbG9yIjoiIzFhMWEyZSJ9">
<style>
  :root {
    --bg: #1a1a2e;
    --surface: #16213e;
    --surface2: #0f3460;
    --accent: #e94560;
    --accent2: #f5a623;
    --text: #eee;
    --text-dim: #8892a4;
    --green: #4ecca3;
    --red: #e94560;
    --yellow: #f5a623;
    --radius: 12px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100dvh; overflow-x: hidden;
  }

  /* Header */
  .header {
    background: var(--surface);
    padding: 16px 20px;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    position: sticky; top: 0; z-index: 100;
  }
  .header h1 { font-size: 18px; font-weight: 600; }
  .header .subtitle { font-size: 12px; color: var(--text-dim); }
  .header-back {
    background: none; border: none; color: var(--text); font-size: 24px;
    cursor: pointer; padding: 4px 8px; margin-left: -8px;
  }
  .header-right { display: flex; gap: 8px; }
  .btn-icon {
    background: var(--surface2); border: none; color: var(--text);
    width: 36px; height: 36px; border-radius: 8px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; font-size: 18px;
  }
  .btn-header-date {
    background: var(--surface2); color: var(--text);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 13px; font-weight: 600;
    cursor: pointer;
    display: inline-flex; align-items: center; gap: 4px;
    max-width: 180px; white-space: nowrap;
  }
  .btn-header-date:active { background: var(--surface); }

  /* Screens — bottom padding clears nav-tabs AND a stacked save bar */
  .screen { display: none; padding-bottom: calc(140px + env(safe-area-inset-bottom)); }
  .screen.active { display: block; }

  /* Home screen */
  .home-hero {
    padding: 32px 20px 24px;
    text-align: center;
  }
  .home-hero h2 { font-size: 22px; margin-bottom: 4px; }
  .home-hero p { color: var(--text-dim); font-size: 14px; }

  /* Collapsible location groups (restock) */
  .collapse-group {
    margin: 8px 16px; background: var(--surface);
    border-radius: var(--radius); border: 1px solid rgba(255,255,255,0.04);
    overflow: hidden;
  }
  .collapse-header {
    width: 100%; background: none; border: none; color: var(--text);
    padding: 16px; display: flex; align-items: center; gap: 12px;
    cursor: pointer; text-align: left;
  }
  .collapse-header:active { background: var(--surface2); }
  .collapse-title { font-size: 16px; font-weight: 600; flex: 1; }
  .collapse-count {
    background: var(--surface2); padding: 3px 10px; border-radius: 20px;
    font-size: 12px; font-weight: 600; color: var(--text-dim);
  }
  .collapse-count.need { background: rgba(245,166,35,0.15); color: var(--yellow); }
  .collapse-count.done { background: rgba(78,204,163,0.15); color: var(--green); }
  .collapse-header .chevron {
    font-size: 13px; color: var(--text-dim);
    transition: transform 0.2s; flex-shrink: 0;
  }
  .collapse-group.open .chevron { transform: rotate(90deg); }
  .collapse-body { display: none; padding: 0 16px 12px; }
  .collapse-group.open .collapse-body { display: block; }
  .restock-item {
    display: flex; align-items: center; gap: 12px;
    padding: 11px 0; border-bottom: 1px solid rgba(255,255,255,0.04);
    cursor: pointer;
  }
  .restock-item:last-child { border-bottom: none; }
  .restock-check {
    width: 22px; height: 22px; flex-shrink: 0;
    accent-color: var(--green); cursor: pointer;
  }
  .restock-name { flex: 1; font-size: 15px; font-weight: 500; }
  .restock-qty { font-size: 15px; font-weight: 700; color: var(--yellow); flex-shrink: 0; }
  .restock-item.checked .restock-name { text-decoration: line-through; color: var(--text-dim); }
  .restock-item.checked .restock-qty { color: var(--text-dim); }
  .restock-empty { padding: 11px 0; color: var(--text-dim); font-size: 14px; }

  /* Location cards */
  .location-grid {
    padding: 0 16px;
    display: grid; gap: 12px;
  }
  .loc-card {
    background: var(--surface); border-radius: var(--radius);
    padding: 18px 16px; cursor: pointer;
    display: flex; align-items: center; gap: 14px;
    transition: transform 0.15s, background 0.15s;
    border: 1px solid rgba(255,255,255,0.04);
  }
  .loc-card:active { transform: scale(0.98); background: var(--surface2); }
  .loc-icon {
    width: 44px; height: 44px; border-radius: 10px;
    background: var(--surface2);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; flex-shrink: 0;
  }
  .loc-info { flex: 1; }
  .loc-info h3 { font-size: 16px; font-weight: 600; }
  .loc-info p { font-size: 13px; color: var(--text-dim); margin-top: 2px; }
  .loc-badge {
    background: var(--surface2); padding: 4px 10px; border-radius: 20px;
    font-size: 12px; color: var(--text-dim); font-weight: 500;
  }
  .loc-badge.done { background: rgba(78,204,163,0.15); color: var(--green); }

  /* Count screen */
  .count-header-info {
    padding: 16px 20px 8px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .count-header-info .progress { font-size: 13px; color: var(--text-dim); }
  .progress-bar {
    height: 3px; background: var(--surface2);
    margin: 0 20px 8px; border-radius: 2px; overflow: hidden;
  }
  .progress-bar .fill {
    height: 100%; background: var(--green);
    transition: width 0.3s ease;
  }
  .category-section { margin: 16px 0 8px; padding: 0 20px; }
  .category-label {
    font-size: 12px; font-weight: 700; color: var(--accent);
    text-transform: uppercase; letter-spacing: 0.5px;
  }
  .drink-row {
    padding: 12px 20px;
    display: flex; align-items: center; gap: 12px;
    border-bottom: 1px solid rgba(255,255,255,0.03);
  }
  .drink-row.counted { opacity: 0.6; }
  .drink-row.adjusted .count-val { border-color: var(--yellow); color: var(--yellow); }
  .drink-row.adjusted .drink-name { color: var(--yellow); }
  .drink-info { flex: 1; min-width: 0; }
  .drink-name { font-size: 15px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .drink-meta { font-size: 12px; color: var(--text-dim); margin-top: 1px; }
  .count-input-wrap {
    display: flex; align-items: center; gap: 0; flex-shrink: 0;
  }
  .count-btn {
    width: 36px; height: 40px;
    background: var(--surface2); border: none; color: var(--text);
    font-size: 20px; font-weight: 600; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .count-btn:first-child { border-radius: 8px 0 0 8px; }
  .count-btn:last-child { border-radius: 0 8px 8px 0; }
  .count-btn:active { background: var(--accent); }
  .count-val {
    width: 50px; height: 40px; text-align: center;
    background: var(--surface); border: 1px solid rgba(255,255,255,0.1);
    color: var(--text); font-size: 16px; font-weight: 600;
    border-left: none; border-right: none;
    -moz-appearance: textfield;
  }
  .count-val::-webkit-inner-spin-button { display: none; }

  /* Save bar */
  .save-bar {
    position: fixed; bottom: 0; left: 0; right: 0;
    padding: 12px 16px; padding-bottom: max(12px, env(safe-area-inset-bottom));
    background: var(--surface);
    border-top: 1px solid rgba(255,255,255,0.06);
    display: flex; gap: 10px; z-index: 110;  /* above nav-tabs */
  }
  /* When nav-tabs are visible underneath, sit just above them so neither covers
     the other. Nav-tab content is ~55px tall; its safe-area inset is rendered
     by .nav-tabs, so we don't need it here too. */
  .save-bar.with-tabs {
    bottom: calc(55px + env(safe-area-inset-bottom));
    padding-bottom: 12px;
  }
  .btn-save {
    flex: 1; padding: 14px;
    background: var(--green); color: #1a1a2e;
    border: none; border-radius: 10px;
    font-size: 16px; font-weight: 700; cursor: pointer;
  }
  .btn-save:disabled { opacity: 0.4; }
  .btn-secondary {
    padding: 14px 20px;
    background: var(--surface2); color: var(--text);
    border: none; border-radius: 10px;
    font-size: 14px; font-weight: 600; cursor: pointer;
  }

  /* Restock & Order views */
  .restock-card, .order-card {
    margin: 8px 16px;
    background: var(--surface); border-radius: var(--radius);
    padding: 14px 16px;
    border: 1px solid rgba(255,255,255,0.04);
  }
  .restock-card h4, .order-card h4 { font-size: 15px; font-weight: 600; }
  .restock-card .qty { font-size: 13px; color: var(--yellow); margin-top: 2px; }
  .order-card .row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid rgba(255,255,255,0.03);
  }
  .order-card .row:last-child { border: none; }
  .order-qty-input {
    width: 60px; height: 36px; text-align: center;
    background: var(--bg); border: 1px solid var(--yellow);
    color: var(--text); font-size: 15px; font-weight: 600;
    border-radius: 8px;
  }

  /* Simplified order rows */
  .order-row {
    margin: 6px 16px; padding: 12px 14px;
    background: var(--surface); border-radius: var(--radius);
    border: 1px solid rgba(255,255,255,0.04);
    display: flex; align-items: center; gap: 10px;
  }
  .order-name {
    flex: 1; font-size: 15px; font-weight: 600; min-width: 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .order-controls { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .order-x { color: var(--text-dim); font-size: 14px; }
  .order-qty {
    width: 48px; height: 36px; text-align: center;
    background: var(--bg); border: 1px solid var(--yellow);
    color: var(--text); font-size: 15px; font-weight: 600;
    border-radius: 8px;
    -moz-appearance: textfield;
  }
  .order-qty::-webkit-inner-spin-button { display: none; }
  .order-pack {
    height: 36px; max-width: 150px;
    background: var(--surface2); border: 1px solid rgba(255,255,255,0.08);
    color: var(--text); font-size: 13px; font-weight: 500;
    border-radius: 8px; padding: 0 22px 0 10px;
    -webkit-appearance: none; appearance: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path fill='%238892a4' d='M0 0l5 6 5-6z'/></svg>");
    background-repeat: no-repeat;
    background-position: right 8px center;
  }
  .order-pack-static {
    height: 36px; line-height: 36px;
    padding: 0 10px;
    background: var(--surface2); border: 1px solid rgba(255,255,255,0.08);
    color: var(--text); font-size: 13px; font-weight: 500;
    border-radius: 8px;
    max-width: 150px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  /* Par-levels editor */
  .par-cat-label {
    font-size: 11px; font-weight: 700; color: var(--accent);
    text-transform: uppercase; letter-spacing: 0.5px;
    margin: 12px 0 2px;
  }
  .par-row {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 0;
    border-bottom: 1px solid rgba(255,255,255,0.04);
  }
  .par-row:last-child { border-bottom: none; }
  .par-row.zero { opacity: 0.45; }
  .par-row.changed {
    background: rgba(245,166,35,0.08);
    margin: 0 -8px; padding-left: 8px; padding-right: 8px;
    border-radius: 6px;
    opacity: 1;
  }
  .par-name-wrap { flex: 1; min-width: 0; }
  .par-name { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .par-meta { font-size: 11px; color: var(--text-dim); margin-top: 1px; }
  .par-input {
    width: 56px; height: 36px; text-align: center;
    background: var(--bg); border: 1px solid rgba(255,255,255,0.12);
    color: var(--text); font-size: 15px; font-weight: 600;
    border-radius: 8px;
    -moz-appearance: textfield;
  }
  .par-input::-webkit-inner-spin-button { display: none; }
  .par-input:focus { border-color: var(--accent); outline: none; }
  .par-row.changed .par-input { border-color: var(--yellow); color: var(--yellow); }

  .section-title {
    padding: 20px 20px 8px;
    font-size: 13px; font-weight: 700;
    color: var(--text-dim); text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .empty-state {
    text-align: center; padding: 40px 20px;
    color: var(--text-dim); font-size: 15px;
  }
  .empty-state .icon { font-size: 40px; margin-bottom: 12px; }

  /* Nav tabs (bottom) */
  .nav-tabs {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--surface);
    border-top: 1px solid rgba(255,255,255,0.06);
    display: flex; z-index: 100;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .nav-tab {
    flex: 1; padding: 10px 0 8px; text-align: center;
    background: none; border: none; color: var(--text-dim);
    cursor: pointer; font-size: 11px;
  }
  .nav-tab .icon { font-size: 22px; display: block; margin-bottom: 2px; }
  .nav-tab.active { color: var(--accent); }

  /* Loading */
  .loading {
    display: flex; align-items: center; justify-content: center;
    padding: 60px 20px; color: var(--text-dim);
  }
  .spinner {
    width: 24px; height: 24px; border: 3px solid var(--surface2);
    border-top-color: var(--accent); border-radius: 50%;
    animation: spin 0.8s linear infinite; margin-right: 12px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Toast */
  .toast {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
    background: var(--green); color: #1a1a2e; padding: 12px 24px;
    border-radius: 10px; font-weight: 600; font-size: 14px;
    z-index: 200; opacity: 0; transition: opacity 0.3s;
    pointer-events: none;
  }
  .toast.show { opacity: 1; }
</style>

  <div class="screen active" id="homeScreen">

  <!-- COUNT SCREEN -->
  <div class="screen" id="countScreen">

    <div class="progress-bar"><div class="fill" id="progressFill"></div></div>

  <!-- ORDER SCREEN -->
  <div class="screen" id="orderScreen">
    <div class="section-title">Order Suggestions</div>

  <!-- NAV TABS -->

    <button class="nav-tab" onclick="showTab('restock')">
      <span class="icon">📦</span>Restock

    <button class="nav-tab" onclick="showTab('order')">

</div>

<!-- Hidden delivery-date picker (Order screen) -->
<input type="date" id="deliveryDatePicker"
       onchange="setDeliveryDate(this.value)"
       style="position:absolute; left:-9999px; top:-9999px; opacity:0; pointer-events:none;">

<div class="toast" id="toast"></div>

<script>
// ── Supabase config ──
const SUPABASE_URL = 'https://jorflggahzaoryxrefms.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpvcmZsZ2dhaHphb3J5eHJlZm1zIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk0NDExMzMsImV4cCI6MjA5NTAxNzEzM30.zQp2jlQJBG5bXwouTRnHEBg7he_CFIpvxS3L-DhIbfU';

// ── API helper ──
async function sb(path, { method = 'GET', body, single = false, upsert = false } = {}) {
  const headers = {
    'apikey': SUPABASE_KEY,
    'Authorization': `Bearer ${SUPABASE_KEY}`,
    'Content-Type': 'application/json',
  };
  if (upsert) headers['Prefer'] = 'resolution=merge-duplicates,return=representation';
  else if (method === 'POST') headers['Prefer'] = 'return=representation';
  else if (method === 'PATCH') headers['Prefer'] = 'return=representation';
  if (single) headers['Accept'] = 'application/vnd.pgrst.object+json';

  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    method, headers,
    body: body ? JSON.stringify(body) : undefined
  });
  if (!res.ok) {
    const err = await res.text();
    throw new Error(`Supabase error: ${res.status} ${err}`);
  }
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}

// ── State ──
let locations = [];
let drinks = [];
let pars = [];
let session = null;
let currentLocationId = null;
let countValues = {}; // { `${drink_id}-${location_id}`: value }
let locationCounts = {}; // { location_id: { drink_id: value } }
let orderState = {}; // { drink_id: { qty, packKey, drinkName, drinkPackSize } }
let parEdits = {};   // { 'drinkId-locationId': new_par_value }
let deliveryDate = new Date(); // default delivery date for orders = today

// ── Delivery date helpers ──
function formatDeliveryDate(d) {
  return d.toLocaleDateString('en-AU', { weekday: 'short', day: 'numeric', month: 'short' });
}
function deliveryDateAsISO(d) {
  const yr = d.getFullYear();
  const mo = String(d.getMonth() + 1).padStart(2, '0');
  const dy = String(d.getDate()).padStart(2, '0');
  return `${yr}-${mo}-${dy}`;
}
function setDeliveryDate(iso) {
  if (!iso) return;
  const [y, m, d] = iso.split('-').map(Number);
  if (!y || !m || !d) return;
  deliveryDate = new Date(y, m - 1, d);
  const lbl = document.getElementById('deliveryDateLabel');
  if (lbl) lbl.textContent = formatDeliveryDate(deliveryDate);
}
function openDeliveryDatePicker() {
  const input = document.getElementById('deliveryDatePicker');
  if (!input) return;
  input.value = deliveryDateAsISO(deliveryDate);
  if (typeof input.showPicker === 'function') {
    try { input.showPicker(); return; } catch (e) {}
  }
  input.click();
  input.focus();
}
function setDeliveryHeaderButton() {
  const r = document.getElementById('headerRight');
  if (!r) return;
  r.innerHTML = `<button class="btn-header-date" type="button" onclick="openDeliveryDatePicker()">📅 <span id="deliveryDateLabel">${formatDeliveryDate(deliveryDate)}</span></button>`;
  const input = document.getElementById('deliveryDatePicker');
  if (input) input.value = deliveryDateAsISO(deliveryDate);
}

// ── Pack options for ordering ──
// Each drink's pack options come from its OWN data: fridge_unit, store_room_unit,
// pack_size and conversion_factor (loaded from the Pars Worksheet). We don't
// invent options — we ask the drink what pack it ships in.

function makePackOption(pieces, piece) {
  // piece is 'bottle' | 'can' | '' (when there's no clear piece word, eg pre-mixes)
  const pieceWord = piece ? ` ${piece}${pieces === 1 ? '' : 's'}` : '';
  let label, singular, plural;
  if (pieces === 1) {
    label    = piece ? `Single ${piece}` : 'Single';
    singular = piece || 'unit';
    plural   = piece ? `${piece}s` : 'units';
  } else if (pieces === 6) {
    label    = `6-pack${pieceWord}`;
    singular = piece ? `6-pack of ${piece}s` : '6-pack';
    plural   = piece ? `6-packs of ${piece}s` : '6-packs';
  } else if (pieces === 12) {
    label    = `Case of 12${pieceWord}`;
    singular = piece ? `case of 12 ${piece}s` : 'case of 12';
    plural   = piece ? `cases of 12 ${piece}s` : 'cases of 12';
  } else if (pieces === 24 || pieces === 30) {
    label    = `Carton of ${pieces}${pieceWord}`;
    singular = piece ? `carton of ${pieces} ${piece}s` : `carton of ${pieces}`;
    plural   = piece ? `cartons of ${pieces} ${piece}s` : `cartons of ${pieces}`;
  } else {
    label    = `${pieces}-pack${pieceWord}`;
    singular = piece ? `${pieces}-pack of ${piece}s` : `${pieces}-pack`;
    plural   = piece ? `${pieces}-packs of ${piece}s` : `${pieces}-packs`;
  }
  return { key: `${pieces}-${piece || 'unit'}`, label, singular, plural, pieces };
}

function packDescriptors(drink) {
  // Returns { options: [pack], defaultKey } for a single drink.
  const fu  = (drink.fridge_unit || '').trim();
  const sru = (drink.store_room_unit || '').trim();
  const ps  = drink.pack_size || 1;

  // Jugs are a thing of their own
  if (sru === 'Jugs' || fu === 'Jugs') {
    const o = { key: 'jug', label: 'Jug', singular: 'jug', plural: 'jugs', pieces: 1 };
    return { options: [o], defaultKey: o.key };
  }

  // Piece word (cans vs bottles) comes from fridge_unit since that's what's
  // physically in the package.
  let piece = '';
  if (fu === 'Can') piece = 'can';
  else if (fu === 'Bottle') piece = 'bottle';
  // For pre-mixes where fridge_unit is also "Carton-N" the piece word stays blank.

  // Default pack size in pieces:
  //   store_room_unit = "Carton-N"  → N pieces per pack
  //   store_room_unit = "Bottle"/"Can" → pack_size pieces per pack (1, 6, 12, 24, …)
  const cartonMatch = sru.match(/^Carton-(\d+)$/i);
  const defaultPieces = cartonMatch ? parseInt(cartonMatch[1], 10) : ps;

  // Build the options set: always include the default; add sensible alternatives
  // (1, 6, 12, 24, 30) only for drinks that come in bottles or cans.
  const sizes = new Set([defaultPieces]);
  if (piece === 'bottle' || piece === 'can') {
    [1, 6, 12, 24, 30].forEach(s => sizes.add(s));
  }
  const options = Array.from(sizes).sort((a, b) => a - b).map(s => makePackOption(s, piece));
  const defaultKey = makePackOption(defaultPieces, piece).key;
  return { options, defaultKey };
}

function lastPackKey(drinkId) {
  try { return localStorage.getItem(`order-pack-${drinkId}`); } catch (e) { return null; }
}
function setLastPackKey(drinkId, key) {
  try { localStorage.setItem(`order-pack-${drinkId}`, key); } catch (e) {}
}

// ── Init ──
async function init() {
  try {
    // Load reference data
    [locations, drinks, pars] = await Promise.all([
      sb('locations?order=sort_order'),
      sb('drinks?active=eq.true&order=category,sub_category,name'),
      sb('pars?select=*')
    ]);

    // Get or create today's session
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('sessionDate').textContent = formatDate(today);

    try {
      session = await sb(`stocktake_sessions?session_date=eq.${today}`, { single: true });
    } catch {
      // No session yet — create one
      session = await sb('stocktake_sessions', {
        method: 'POST', single: true,
        body: { session_date: today }
      });
    }

    // Load existing counts for this session
    if (session) {
      const existing = await sb(`counts?session_id=eq.${session.id}`);
      existing.forEach(c => {
        const key = `${c.drink_id}-${c.location_id}`;
        countValues[key] = c.count_value;
        if (!locationCounts[c.location_id]) locationCounts[c.location_id] = {};
        locationCounts[c.location_id][c.drink_id] = c.count_value;
      });
    }

    renderLocations();
    document.getElementById('navTabs').style.display = 'flex';

  } catch (err) {
    console.error(err);
    toast('Error loading — pull to refresh');
  }
}

// ── Render locations ──
function renderLocations() {
  const icons = { 'Top Deck': '🍹', 'Fwd Deck': '⛵', 'Store Room Fridge': '🧊', 'Wheel House': '🍷', 'Store Room': '📦' };
  const grid = document.getElementById('locationGrid');

  grid.innerHTML = locations.map(loc => {
    const drinksHere = pars.filter(p => p.location_id === loc.id && p.par_level >= 0);
    const counted = drinksHere.filter(p => countValues[`${p.drink_id}-${loc.id}`] !== undefined).length;
    const total = drinksHere.length;
    const isDone = counted === total && total > 0;

    return `
      <div class="loc-card" onclick="openLocation(${loc.id})">
        <div class="loc-icon">${icons[loc.name] || '📋'}</div>
        <div class="loc-info">
          <h3>${loc.name}</h3>
          <p>${total} drinks</p>
        </div>
        <div class="loc-badge ${isDone ? 'done' : ''}">${counted}/${total}</div>
      </div>
    `;
  }).join('');
}

// ── Open location for counting ──
function openLocation(locId) {
  currentLocationId = locId;
  const loc = locations.find(l => l.id === locId);

  // Get drinks at this location (via pars)
  const drinkIds = pars.filter(p => p.location_id === locId).map(p => p.drink_id);
  const drinksHere = drinks.filter(d => drinkIds.includes(d.id));

  document.getElementById('countLocation').textContent = loc.name;

  // Group by category
  const groups = {};
  drinksHere.forEach(d => {
    const cat = d.sub_category || d.category;
    if (!groups[cat]) groups[cat] = [];
    groups[cat].push(d);
  });

  let html = '';
  for (const [cat, items] of Object.entries(groups)) {
    html += `<div class="category-section"><div class="category-label">${cat}</div></div>`;
    items.forEach(d => {
      const par = pars.find(p => p.drink_id === d.id && p.location_id === locId);
      const parLevel = par ? par.par_level : 0;
      const key = `${d.id}-${locId}`;

      // Pre-fill with par level if no count exists yet — crew just subtract what's missing
      if (countValues[key] === undefined) {
        countValues[key] = parLevel;
        if (!locationCounts[locId]) locationCounts[locId] = {};
        locationCounts[locId][d.id] = parLevel;
      }
      const val = countValues[key];
      const isAtPar = val === parLevel;
      const unit = loc.name === 'Store Room' ? d.store_room_unit : d.fridge_unit;

      html += `
        <div class="drink-row ${isAtPar ? '' : 'adjusted'}" id="row-${key}">
          <div class="drink-info">
            <div class="drink-name">${d.name}</div>
            <div class="drink-meta">Par: ${parLevel} ${unit}${unit.includes('Carton') ? 's' : ''}</div>
          </div>
          <div class="count-input-wrap">
            <button class="count-btn" onclick="adjustCount(${d.id},${locId},-1)">−</button>
            <input class="count-val" type="number" inputmode="numeric" min="0" step="0.5"
              id="input-${key}" value="${val}"
              onfocus="this.select()"
              oninput="updateCount(${d.id},${locId},this.value)">
            <button class="count-btn" onclick="adjustCount(${d.id},${locId},1)">+</button>
          </div>
        </div>
      `;
    });
  }

  document.getElementById('drinksList').innerHTML = html;
  updateProgress();
  showScreen('count');
}

function adjustCount(drinkId, locId, delta) {
  const key = `${drinkId}-${locId}`;
  const input = document.getElementById(`input-${key}`);
  let val = parseFloat(input.value) || 0;
  val = Math.max(0, val + delta);
  input.value = val;
  updateCount(drinkId, locId, val);
}

function updateCount(drinkId, locId, val) {
  const key = `${drinkId}-${locId}`;
  if (val === '' || val === undefined) {
    delete countValues[key];
  } else {
    countValues[key] = parseFloat(val);
    if (!locationCounts[locId]) locationCounts[locId] = {};
    locationCounts[locId][drinkId] = parseFloat(val);
  }

  // Highlight items adjusted below par in yellow
  const row = document.getElementById(`row-${key}`);
  if (row) {
    const par = pars.find(p => p.drink_id === drinkId && p.location_id === locId);
    const parLevel = par ? par.par_level : 0;
    const numVal = parseFloat(val) || 0;
    row.classList.toggle('adjusted', numVal < parLevel);
  }
  updateProgress();
}

function updateProgress() {
  const drinkPars = pars.filter(p => p.location_id === currentLocationId);
  const total = drinkPars.length;
  // Count items adjusted away from par (i.e. crew has touched them)
  const adjusted = drinkPars.filter(p => {
    const key = `${p.drink_id}-${currentLocationId}`;
    return countValues[key] !== undefined && countValues[key] !== p.par_level;
  }).length;

  document.getElementById('countProgress').textContent = adjusted > 0
    ? `${adjusted} adjusted`
    : `${total} drinks — all at par`;
  document.getElementById('progressFill').style.width = '100%';
}

// ── Save counts ──
async function saveCounts() {
  const btn = document.getElementById('btnSaveCounts');
  btn.disabled = true;
  btn.textContent = 'Saving...';

  try {
    const rows = [];
    for (const [key, val] of Object.entries(countValues)) {
      const [drinkId, locId] = key.split('-').map(Number);
      if (parseInt(locId) === currentLocationId) {
        rows.push({
          session_id: session.id,
          drink_id: drinkId,
          location_id: locId,
          count_value: val,
          counted_at: new Date().toISOString()
        });
      }
    }

    if (rows.length > 0) {
      await sb('counts?on_conflict=session_id,drink_id,location_id', {
        method: 'POST', body: rows, upsert: true
      });
    }

    toast('Counts saved!');
    renderLocations();
    // Go straight to restock view for this location
    showScreen('restock');

  } catch (err) {
    console.error(err);
    toast('Error saving — try again');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Save Counts';
  }
}

// ── Restock view ──
function renderRestock() {
  // One collapsible group per fridge location. Collapsed by default —
  // the item list only shows when the crew taps the location header.
  const fridgeLocs = locations.filter(l => l.id !== 5); // Everything except Store Room
  let html = '';
  let anyCounted = false;

  fridgeLocs.forEach(loc => {
    const items = [];
    const drinkIds = pars.filter(p => p.location_id === loc.id).map(p => p.drink_id);
    let locCounted = false;

    drinkIds.forEach(did => {
      const key = `${did}-${loc.id}`;
      if (countValues[key] === undefined) return;
      locCounted = true;

      const par = pars.find(p => p.drink_id === did && p.location_id === loc.id);
      if (!par || par.par_level <= 0) return;

      const onHand = countValues[key];
      const needed = par.par_level - onHand;

      if (needed > 0) {
        const drink = drinks.find(d => d.id === did);
        items.push({ drink, needed, par: par.par_level, onHand });
      }
    });

    if (locCounted) anyCounted = true;

    const count = items.length;
    const badgeClass = count > 0 ? 'need' : 'done';
    const badgeText = count > 0 ? `${count} to restock` : 'At par';

    let body;
    if (count > 0) {
      body = items.map(item => `
          <label class="restock-item">
            <input type="checkbox" class="restock-check"
              onchange="this.closest('.restock-item').classList.toggle('checked', this.checked)">
            <span class="restock-name">${item.drink.name}</span>
            <span class="restock-qty">× ${item.needed}</span>
          </label>
        `).join('');
    } else {
      body = `<div class="restock-empty">${locCounted ? 'Everything at par — nothing to restock.' : 'Not counted yet.'}</div>`;
    }

    html += `
      <div class="collapse-group" id="restock-loc-${loc.id}">
        <button class="collapse-header" onclick="toggleRestockLoc(${loc.id})">
          <span class="collapse-title">${loc.name}</span>
          <span class="collapse-count ${badgeClass}">${badgeText}</span>
          <span class="chevron">▶</span>
        </button>
        <div class="collapse-body">${body}</div>
      </div>
    `;
  });

  if (!anyCounted) {
    html = `<div class="empty-state"><div class="icon">📋</div>No counts yet — count a location first</div>`;
  }

  document.getElementById('restockList').innerHTML = html;
}

function toggleRestockLoc(locId) {
  document.getElementById(`restock-loc-${locId}`).classList.toggle('open');
}

// ── Order view ──
function renderOrders() {
  // Order is triggered when Store Room count drops a FULL unit below par.
  // Each row is a single line: name × [qty] [pack picker ▼].
  // The pack options for each row come from THAT drink's data
  // (store_room_unit + fridge_unit + pack_size + conversion_factor).
  const storeRoomId = 5;
  const storeRoomPars = pars.filter(p => p.location_id === storeRoomId && p.par_level > 0);
  let html = '';
  let hasOrders = false;
  orderState = {};

  storeRoomPars.forEach(par => {
    const key = `${par.drink_id}-${storeRoomId}`;
    if (countValues[key] === undefined) return;

    const onHand = countValues[key];
    const deficit = par.par_level - onHand;
    if (deficit < 1) return;

    const drink = drinks.find(d => d.id === par.drink_id);
    if (!drink) return;
    hasOrders = true;

    const desc = packDescriptors(drink);
    // Last-used pack for this drink; fall back to the data-driven default.
    let packKey = lastPackKey(drink.id) || desc.defaultKey;
    if (!desc.options.some(o => o.key === packKey)) packKey = desc.defaultKey;
    const pack = desc.options.find(o => o.key === packKey);

    // Pieces needed = deficit (in store-room units) × conversion_factor.
    // Example: Corona deficit=2 cartons, conv=24 → 48 bottles short.
    // Wine deficit=10 bottles, conv=1 → 10 bottles short.
    const piecesNeeded = Math.ceil(deficit) * (drink.conversion_factor || 1);
    const qty = Math.max(1, Math.ceil(piecesNeeded / pack.pieces));

    orderState[drink.id] = { qty, packKey, drinkName: drink.name, options: desc.options };

    const optsHtml = desc.options.map(o =>
      `<option value="${o.key}"${o.key === packKey ? ' selected' : ''}>${o.label}</option>`
    ).join('');
    const showPicker = desc.options.length > 1;
    const packCell = showPicker
      ? `<select class="order-pack" onchange="updateOrderPack(${drink.id}, this.value)">${optsHtml}</select>`
      : `<span class="order-pack-static">${pack.label}</span>`;

    html += `
      <div class="order-row" id="order-row-${drink.id}">
        <div class="order-name">${drink.name}</div>
        <div class="order-controls">
          <span class="order-x">×</span>
          <input class="order-qty" type="number" inputmode="numeric" min="0" value="${qty}"
                 onfocus="this.select()"
                 onchange="updateOrderQty(${drink.id}, this.value)">
          ${packCell}
        </div>
      </div>
    `;
  });

  if (!hasOrders) {
    html = `<div class="empty-state"><div class="icon">👍</div>Store room is stocked — no orders needed</div>`;
    document.getElementById('orderSaveBar').style.display = 'none';
  } else {
    document.getElementById('orderSaveBar').style.display = 'flex';
  }

  document.getElementById('orderList').innerHTML = html;
}

function updateOrderQty(drinkId, val) {
  if (!orderState[drinkId]) return;
  orderState[drinkId].qty = Math.max(0, parseFloat(val) || 0);
}
function updateOrderPack(drinkId, packKey) {
  const s = orderState[drinkId];
  if (!s) return;
  const oldPack = s.options.find(o => o.key === s.packKey);
  const newPack = s.options.find(o => o.key === packKey);
  if (!oldPack || !newPack) return;
  // Preserve total pieces when switching pack format.
  const totalPieces = s.qty * oldPack.pieces;
  const newQty = Math.max(1, Math.ceil(totalPieces / newPack.pieces));
  s.packKey = packKey;
  s.qty = newQty;
  setLastPackKey(drinkId, packKey);
  const row = document.getElementById(`order-row-${drinkId}`);
  if (row) {
    const input = row.querySelector('.order-qty');
    if (input) input.value = newQty;
  }
}

async function saveOrders() {
  const rows = Object.entries(orderState)
    .filter(([_, s]) => s.qty > 0)
    .map(([drinkId, s]) => ({
      session_id: session.id,
      drink_id: parseInt(drinkId),
      suggested_qty: s.qty,
      final_qty: s.qty
    }));
  if (rows.length === 0) return;
  await sb('orders?on_conflict=session_id,drink_id', {
    method: 'POST', body: rows, upsert: true
  });
}

function buildOrderText() {
  const lines = Object.entries(orderState)
    .filter(([_, s]) => s.qty > 0)
    .map(([_, s]) => {
      const pack = s.options.find(o => o.key === s.packKey) || s.options[0];
      const label = s.qty === 1 ? pack.singular : pack.plural;
      return `• ${s.drinkName} × ${s.qty} ${label}`;
    });
  if (lines.length === 0) return '';
  const dateStr = formatDeliveryDate(deliveryDate);
  return `G'day Tony,\nCape Adieu drinks order;\nDelivery on ${dateStr}:\n\n${lines.join('\n')}\n\nthanks.`;
}

async function sendOrder() {
  const text = buildOrderText();
  if (!text) { toast('Nothing to order'); return; }
  // Save to DB silently first
  try { await saveOrders(); } catch (e) { console.error('Save failed', e); }
  // Try Web Share API (iOS share sheet includes Messages, Mail, etc.)
  if (navigator.share) {
    try {
      await navigator.share({ text, title: 'Cape Adieu drinks order' });
      toast('Order sent');
      return;
    } catch (e) {
      if (e && e.name === 'AbortError') return; // user cancelled
      // fall through to SMS fallback
    }
  }
  // Fallback: open Messages app pre-filled
  window.location.href = `sms:?&body=${encodeURIComponent(text)}`;
}

async function copyOrder() {
  const text = buildOrderText();
  if (!text) { toast('Nothing to order'); return; }
  try {
    await navigator.clipboard.writeText(text);
    toast('Copied');
  } catch (e) {
    toast('Copy failed');
  }
}

// ── Par levels editor ──
function renderPars() {
  parEdits = {};
  let html = '';

  locations.forEach(loc => {
    // Drinks that have a par row at this location (existing rows in `pars`)
    const locPars = pars.filter(p => p.location_id === loc.id);
    const drinkIds = locPars.map(p => p.drink_id);
    const locDrinks = drinks.filter(d => drinkIds.includes(d.id));

    // Group by sub_category or category
    const groups = {};
    locDrinks.forEach(d => {
      const cat = d.sub_category || d.category || 'Other';
      if (!groups[cat]) groups[cat] = [];
      groups[cat].push(d);
    });

    let body = '';
    // Sort categories for stable order
    Object.keys(groups).sort().forEach(cat => {
      const items = groups[cat];
      // Within category: stocked drinks first, then unstocked
      items.sort((a, b) => {
        const pa = (locPars.find(p => p.drink_id === a.id) || {}).par_level || 0;
        const pb = (locPars.find(p => p.drink_id === b.id) || {}).par_level || 0;
        if ((pa > 0) !== (pb > 0)) return pa > 0 ? -1 : 1;
        return a.name.localeCompare(b.name);
      });
      body += `<div class="par-cat-label">${cat}</div>`;
      items.forEach(d => {
        const par = locPars.find(p => p.drink_id === d.id);
        const val = par ? par.par_level : 0;
        const unit = loc.name === 'Store Room' ? d.store_room_unit : d.fridge_unit;
        body += `
          <div class="par-row ${val === 0 ? 'zero' : ''}" id="par-row-${d.id}-${loc.id}">
            <div class="par-name-wrap">
              <div class="par-name">${d.name}</div>
              <div class="par-meta">${unit || ''}</div>
            </div>
            <input class="par-input" type="number" inputmode="numeric" min="0" step="0.5"
                   value="${val}"
                   onfocus="this.select()"
                   onchange="updatePar(${d.id}, ${loc.id}, this.value)">
          </div>
        `;
      });
    });

    const stockedCount = locPars.filter(p => p.par_level > 0).length;
    html += `
      <div class="collapse-group" id="pars-loc-${loc.id}">
        <button class="collapse-header" onclick="togglePars(${loc.id})">
          <span class="collapse-title">${loc.name}</span>
          <span class="collapse-count">${stockedCount} stocked</span>
          <span class="chevron">▶</span>
        </button>
        <div class="collapse-body">${body}</div>
      </div>
    `;
  });

  document.getElementById('parsList').innerHTML = html;
  refreshParsSaveBar();
}

function togglePars(locId) {
  document.getElementById(`pars-loc-${locId}`).classList.toggle('open');
}

function updatePar(drinkId, locId, val) {
  const key = `${drinkId}-${locId}`;
  const newVal = Math.max(0, parseFloat(val) || 0);
  const current = pars.find(p => p.drink_id === drinkId && p.location_id === locId);
  const currentVal = current ? current.par_level : 0;
  if (newVal === currentVal) {
    delete parEdits[key];
  } else {
    parEdits[key] = newVal;
  }
  const row = document.getElementById(`par-row-${drinkId}-${locId}`);
  if (row) {
    row.classList.toggle('changed', parEdits[key] !== undefined);
    row.classList.toggle('zero', newVal === 0 && parEdits[key] === undefined);
  }
  refreshParsSaveBar();
}

function refreshParsSaveBar() {
  const bar = document.getElementById('parsSaveBar');
  if (!bar) return;
  bar.style.display = Object.keys(parEdits).length > 0 ? 'flex' : 'none';
}

function cancelPars() {
  if (Object.keys(parEdits).length === 0) return;
  parEdits = {};
  renderPars();
}

async function savePars() {
  const btn = document.getElementById('btnSavePars');
  btn.disabled = true; btn.textContent = 'Saving…';
  try {
    const rows = Object.entries(parEdits).map(([key, val]) => {
      const [drinkId, locId] = key.split('-').map(Number);
      return { drink_id: drinkId, location_id: locId, par_level: val };
    });
    if (rows.length > 0) {
      await sb('pars?on_conflict=drink_id,location_id', {
        method: 'POST', body: rows, upsert: true
      });
      // Refresh local cache so downstream views (restock/order/count) see new pars
      pars = await sb('pars?select=*');
    }
    parEdits = {};
    renderPars();
    renderLocations();   // counts on home reflect new par totals
    toast('Pars saved');
  } catch (err) {
    console.error(err);
    toast('Error saving pars');
  } finally {
    btn.disabled = false; btn.textContent = 'Save';
  }
}

// ── Navigation ──
function showScreen(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));

  const countSaveBar = document.getElementById('countSaveBar');
  const orderSaveBar = document.getElementById('orderSaveBar');
  const navTabs = document.getElementById('navTabs');

  countSaveBar.style.display = 'none';
  // Reset header-right slot on every screen change; Order will re-populate it.
  document.getElementById('headerRight').innerHTML = '';

  if (name === 'home') {
    document.getElementById('homeScreen').classList.add('active');
    document.getElementById('headerTitle').textContent = 'Drinks Stocktake';
    navTabs.style.display = 'flex';
    document.querySelectorAll('.nav-tab')[0].classList.add('active');
  } else if (name === 'count') {
    document.getElementById('countScreen').classList.add('active');
    document.getElementById('headerTitle').textContent = locations.find(l => l.id === currentLocationId)?.name || 'Count';
    countSaveBar.style.display = 'flex';
    navTabs.style.display = 'none';
  } else if (name === 'restock') {
    renderRestock();
    document.getElementById('restockScreen').classList.add('active');
    document.getElementById('headerTitle').textContent = 'Restock Tonight';
    navTabs.style.display = 'flex';
    document.querySelectorAll('.nav-tab')[1].classList.add('active');
  } else if (name === 'order') {
    renderOrders();
    document.getElementById('orderScreen').classList.add('active');
    document.getElementById('headerTitle').textContent = 'Order Tonight';
    navTabs.style.display = 'flex';
    document.querySelectorAll('.nav-tab')[2].classList.add('active');
    setDeliveryHeaderButton();
  } else if (name === 'pars') {
    renderPars();
    document.getElementById('parsScreen').classList.add('active');
    document.getElementById('headerTitle').textContent = 'Par Levels';
    navTabs.style.display = 'flex';
    document.querySelectorAll('.nav-tab')[3].classList.add('active');
  }
}

function showTab(name) {
  if (name === 'home') showScreen('home');
  else if (name === 'restock') showScreen('restock');
  else if (name === 'order') showScreen('order');
  else if (name === 'pars') showScreen('pars');
}

// ── Helpers ──
function formatDate(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  return d.toLocaleDateString('en-AU', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
}

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2500);
}

// ── Boot ──
init();
</script>
